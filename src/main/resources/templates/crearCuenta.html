<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Crear Cuenta - MindU</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    
    <link rel="stylesheet" href="../static/style/style.css">
</head>
<body class="bg-zinc-50 font-['Inter'] min-h-screen flex flex-col justify-between antialiased text-zinc-900">

    <div class="pt-8"></div>

    <main class="w-full max-w-md mx-auto px-6 flex flex-col items-center">
        
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center mb-3 shadow-sm">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-black font-manrope">MindU</h1>
            <p class="text-zinc-500 text-sm mt-1 font-medium">Portal de Salud Mental de Grado Clínico</p>
        </div>

        <div class="w-full bg-white border border-zinc-200/80 rounded-2xl p-8 shadow-[0_4px_20px_rgba(0,0,0,0.03)]">
            
            <form id="registerForm" onsubmit="procesarRegistro(event)">
                
                <div class="mb-5">
                    <label for="fullName" class="block text-xs font-bold uppercase tracking-wider text-zinc-700 mb-2">
                        Nombre Completo
                    </label>
                    <input 
                        type="text" 
                        id="fullName" 
                        required
                        placeholder="Ej. Sarah Alarcón" 
                        class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition text-sm"
                    />
                </div>

                <div class="mb-5">
                    <label for="email" class="block text-xs font-bold uppercase tracking-wider text-zinc-700 mb-2">
                        Correo Electrónico
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        required
                        placeholder="nombre@clinico.mindu.com" 
                        class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition text-sm"
                    />
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-zinc-700 mb-2">
                        Contraseña
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        placeholder="Crear una contraseña" 
                        class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition text-sm"
                    />
                </div>

                <button 
                    type="submit" 
                    class="w-full py-3.5 bg-black text-white rounded-xl font-semibold text-sm hover:bg-zinc-900 active:scale-[0.98] transition-all duration-150 mb-6 shadow-sm"
                >
                    Registrarse
                </button>

                <div class="relative flex py-2 items-center mb-6">
                    <div class="flex-grow border-t border-zinc-200"></div>
                    <span class="flex-shrink mx-4 text-zinc-400 text-[11px] font-bold uppercase tracking-widest">O registrarse con</span>
                    <div class="flex-grow border-t border-zinc-200"></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="flex items-center justify-center gap-2 px-4 py-2.5 border border-zinc-200 rounded-xl hover:bg-zinc-50 text-zinc-700 font-medium text-sm transition active:scale-[0.98]">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>
                    <button type="button" class="flex items-center justify-center gap-2 px-4 py-2.5 border border-zinc-200 rounded-xl hover:bg-zinc-50 text-zinc-700 font-medium text-sm transition active:scale-[0.98]">
                        <svg class="w-4 h-4 text-black" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.57 2.95-1.39z"/>
                        </svg>
                        Apple
                    </button>
                </div>

            </form>
        </div>

        <p class="text-zinc-500 text-sm mt-6 font-medium">
            ¿Ya tienes una cuenta? <a href="login.html" class="text-black font-bold hover:underline">Iniciar Sesión</a>
        </p>

        <div class="flex gap-4 text-[10px] font-bold text-zinc-400 uppercase tracking-widest mt-6 mb-4">
            <a href="#" class="hover:text-zinc-600 transition">Términos de Servicio</a>
            <a href="#" class="hover:text-zinc-600 transition">Política de Privacidad</a>
            <a href="#" class="hover:text-zinc-600 transition">Cumplimiento</a>
        </div>

    </main>

    <footer class="w-full flex justify-end p-6 pointer-events-none">
        <div class="flex items-center gap-2 border border-zinc-200 bg-white px-3 py-1.5 rounded-full text-[11px] font-medium text-zinc-500 shadow-sm">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
            Cifrado cumple con HIPAA
        </div>
    </footer>

    <script>
        function procesarRegistro(event) {
            event.preventDefault(); // Evita el envío tradicional por backend por ahora
            
            // Simula que la cuenta se creó con éxito y te devuelve al login para autenticarte
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
